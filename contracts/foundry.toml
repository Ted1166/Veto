[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[lint]
exclude_lints = [
    "screaming-snake-case-immutable",
    "unsafe-typecast",
    "mixed-case-function",
    "unsafe-cheatcode",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
